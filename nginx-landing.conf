server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Landing page at root
    location = / {
        try_files /landing/index.html =404;
    }
    location /landing/ {
        try_files $uri $uri/ /landing/index.html;
    }
    location /images/ {
        try_files $uri =404;
    }

    # Game app at /play
    location /play {
        try_files /index.html =404;
    }

    # All other paths → game app (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
