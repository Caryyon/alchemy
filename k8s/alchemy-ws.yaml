# Alchemy WebSocket Server — Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alchemy-ws
  namespace: apps
  labels:
    app: alchemy-ws
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alchemy-ws
  template:
    metadata:
      labels:
        app: alchemy-ws
    spec:
      containers:
      - name: alchemy-ws
        image: localhost:30500/alchemy-ws:latest
        ports:
        - containerPort: 3456
        env:
        - name: PORT
          value: "3456"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: alchemy-ws
  namespace: apps
spec:
  selector:
    app: alchemy-ws
  ports:
  - port: 3456
    targetPort: 3456
    protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: alchemy-ws
  namespace: apps
spec:
  entryPoints:
  - web
  - websecure
  routes:
  - kind: Rule
    match: Host(`alchemy-ws.wolffbyte.studio`)
    services:
    - name: alchemy-ws
      port: 3456
